services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personal-assistant-backend
    env_file:
      - .env
    environment:
      PORT: 8000
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: personal-assistant-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped